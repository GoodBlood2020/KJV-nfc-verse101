<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Daily Lift | Faith + Fitness</title>
  <meta name="description" content="Daily Lift — Faith + Fitness. A daily KJV verse and approachable workout plan. Read scripture, move with purpose, and track your progress.">
  <!-- Shared appearance, including the daily card created by app.js. -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <div class="pill">FAITH + FITNESS</div>
      <h1>Daily Lift</h1>
      <p class="sub">A daily KJV verse and approachable workout plan.</p>
    </header>

    <!-- Keep ref/verse IDs and loadVerse() in sync with the browser controller. -->
    <section class="card" aria-live="polite">
      <div class="row">
        <div class="ref" id="ref">Ready</div>
        <button class="btn" type="button" onclick="loadVerse()">New verse</button>
      </div>
      <div class="verse" id="verse">Tap <b>New verse</b> to load a verse.</div>

      <div class="footer">
        <button class="btn ghost" type="button" id="shareBtn">Share</button>
      </div>
    </section>

    <section class="small note">
      Tip: Put a printed QR code next to the tag for phones without NFC.
    </section>
  </main>

  <!-- Load after the markup so app.js can find the card and insert the daily plan. -->
  <script src="app.js"></script>
  <script>
    // Share the displayed random verse, rather than the separate daily plan.
    // Share button
    const shareBtn = document.getElementById('shareBtn');
    shareBtn.addEventListener('click', async () => {
      const ref = document.getElementById('ref').textContent;
      const verse = document.getElementById('verse').textContent;
      const text = `${ref} — ${verse}`;

      // Prefer the device share sheet; cancellation or rejection is quietly ignored.
      if (navigator.share) {
        try { await navigator.share({ title: "Daily Lift | KJV Verse", text, url: window.location.href }); } catch {}
      // Without native sharing, try copying; if clipboard access fails, show the text.
      } else {
        try {
          await navigator.clipboard.writeText(text);
          shareBtn.textContent = "Copied!";
          setTimeout(() => (shareBtn.textContent = "Share"), 1200);
        } catch {
          alert(text);
        }
      }
    });
  </script>
</body>
</html>
